version: '3.8'

services:
  # ── PostgreSQL with pgvector extension ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: samaadsetu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grievance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grievance_secret}
      POSTGRES_DB: ${POSTGRES_DB:-samaadsetu_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grievance} -d ${POSTGRES_DB:-samaadsetu_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 with Streams ──
  redis:
    image: redis:7-alpine
    container_name: samaadsetu-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend Gateway ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samaadsetu-api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://grievance:grievance_secret@postgres:5432/samaadsetu_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Stateless Stream Consumer Worker ──
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samaadsetu-worker
    restart: always
    command: python -m app.workers.stream_consumer
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://grievance:grievance_secret@postgres:5432/samaadsetu_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
